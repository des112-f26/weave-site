<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weave · Tasks, sewn together</title>
<meta name="description" content="Weave shows your tasks as a web of sewn-on buttons: bigger buttons are due sooner, threads join related tasks.">
<meta name="theme-color" content="#211003">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;amp;family=Fredoka:wght@500;600&amp;amp;family=Patrick+Hand&amp;amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Weave needs JavaScript to draw your task web.</p></noscript>
<template id="weave-template">
<div id="weave-root" class="felt needleroot" ref="{{rootRef}}" style="position: relative; overflow: hidden; min-height: 100vh; display: flex; flex-wrap: wrap; --stitch: {{pal.border}}; background-color: {{pal.bg}}; color: {{pal.ink}}; color-scheme: {{pal.scheme}}; transition: background .4s ease; --ink: {{pal.ink}}; --ink2: {{pal.ink2}}; --ink3: {{pal.ink3}}; --ink4: {{pal.ink4}}; --inv: {{pal.inv}}; --invfg: {{pal.invfg}}; --invsoft: {{pal.invsoft}}; --field: {{pal.field}}; --fieldborder: {{pal.fieldBorder}}; --hover: {{pal.hover}}; --warn: {{pal.warn}}">
<svg width="0" height="0" aria-hidden="true" style="position: absolute"><defs><radialGradient id="nailg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.35" stop-color="#C9C4BC"></stop><stop offset="1" stop-color="#6E655B"></stop></radialGradient><radialGradient id="btnshine" cx="32%" cy="28%" r="70%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"></stop><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"></stop><stop offset="1" stop-color="#000000" stop-opacity="0.12"></stop></radialGradient></defs></svg>





<div style="position: absolute; top: 24px; bottom: 24px; right: 0; width: 340px; max-width: calc(100% - 64px); z-index: 50; transform: translateX({{drawerX}}); transition: transform .5s cubic-bezier(.2,.9,.25,1)">
<section id="task-list" aria-label="Task list" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-sizing: border-box; background: {{pal.menu}}; border: 1px solid {{pal.border}}; border-right: 0; border-radius: 44px 0 0 44px; box-shadow: {{drawerShadow}}; padding: 26px 18px 18px 24px; display: flex; flex-direction: column; gap: 14px; visibility: {{drawerVis}}; pointer-events: {{drawerPe}}; transition: {{drawerTr}}">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-right: 6px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 600; color: var(--ink)">All tasks</h2>
<span style="font-size: 12px; font-weight: 500; color: var(--ink3)">{{openCount}} open · by deadline</span>
</div>
<div style="flex: 1; min-height: 0; position: relative; display: flex">
<div class="listscroll" ref="{{listRef}}" onScroll="{{listScroll}}" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 24px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="border-top: 1px solid {{pal.line}}; padding: 12px 0 6px; display: flex; flex-direction: column; gap: 0">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 8px 4px">
<span style="width: 9px; height: 9px; border-radius: 3px; background: {{g.color}}"></span>
<span style="flex: 1; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{g.dark}}">{{g.name}}</span>
<span style="font-size: 12px; color: var(--ink3)">{{g.count}}</span>
</div>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 2px; border-radius: 10px; background: {{r.bg}}">
<button class="iconbtn" onClick="{{r.done}}" aria-label="{{r.doneLabel}}" style="width: 36px; height: 38px; flex: none; border: 0; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<span style="width: 15px; height: 15px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--ink4)"></span>
</button>
<button class="rowbtn" onClick="{{r.pick}}" style="flex: 1; min-width: 0; min-height: 38px; border: 0; border-radius: 9px; background: transparent; display: flex; align-items: center; gap: 9px; padding: 4px 8px 4px 2px; cursor: pointer; text-align: left">
<span style="width: 14px; height: 14px; flex: none; display: block">
<sc-if value="{{r.isTri}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 40 40" aria-hidden="true" style="display: block"><polygon points="20,5 36,34 4,34" fill="none" stroke="{{r.color}}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polygon></svg></sc-if>
<sc-if value="{{r.isCirc}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 40 40" aria-hidden="true" style="display: block"><circle cx="20" cy="20" r="12" fill="none" stroke="{{r.color}}" stroke-width="2" vector-effect="non-scaling-stroke"></circle></svg></sc-if>
</span>
<span style="flex: 1; min-width: 0; font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
<span style="flex: none; font-size: 12px; font-weight: 500; color: {{r.relColor}}">{{r.rel}}</span>
</button>
</div>
</sc-for>
</div>
</sc-for>
</div>
<div class="bobtrack" ref="{{trackRef}}" onPointerDown="{{trackDown}}" aria-hidden="true" style="position: absolute; right: 0; top: 6px; bottom: 6px; width: 16px; display: none">
<span style="position: absolute; left: 7px; top: 0; bottom: 0; border-left: 2px dashed {{pal.border}}"></span>
<div class="bobthumb" ref="{{thumbRef}}" onPointerDown="{{thumbDown}}"><span class="bobthread"></span></div>
</div>
</div>
</section>
<button onClick="{{toggleList}}" aria-expanded="{{listExpanded}}" aria-controls="task-list" aria-label="{{listLabel}}" style="position: absolute; left: -50px; top: 92px; width: 51px; height: 136px; box-sizing: border-box; padding: 0; background: {{pal.menu}}; border: 1px solid {{pal.border}}; border-right: 0; border-radius: 26px 0 0 26px; box-shadow: -8px 8px 20px rgba(92,62,40,0.10); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6.5 5h8M6.5 9h8M6.5 13h8" stroke="{{pal.ink}}" stroke-width="1.6" stroke-linecap="round"></path><circle cx="3.2" cy="5" r="1.1" fill="{{pal.ink}}"></circle><circle cx="3.2" cy="9" r="1.1" fill="{{pal.ink}}"></circle><circle cx="3.2" cy="13" r="1.1" fill="{{pal.ink}}"></circle></svg>
<span style="writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: 0.02em">List</span>
</button>
</div>

<sc-if value="{{formOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 70">
<button aria-label="Close new task" onClick="{{closeForm}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; padding: 0; background: {{pal.scrim}}; cursor: default"></button>
<div class="ntform" role="dialog" aria-modal="true" aria-labelledby="nt-title" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 480px; max-width: calc(100% - 32px); box-sizing: border-box; background: {{pal.menu}}; border: 1px solid {{pal.border}}; border-radius: 32px; box-shadow: 0 24px 60px rgba(80,52,30,0.22); padding: 22px 26px 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="nt-title" style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 600; color: var(--ink)">New task</h2>
<button class="iconbtn" onClick="{{closeForm}}" aria-label="Close new task" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: -8px"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="{{pal.ink2}}" stroke-width="1.6" stroke-linecap="round"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nt-name" class="flabel">Task</label>
<input id="nt-name" class="field" type="text" placeholder="What needs doing?" value="{{nf.title}}" onChange="{{nf.setTitle}}">
<sc-if value="{{nf.showErr}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 500; color: var(--warn)">Give the task a name first.</span></sc-if>
</div>

<div role="group" aria-labelledby="nt-cat" style="display: flex; flex-direction: column; gap: 6px">
<span id="nt-cat" class="flabel">Category</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{nf.cats}}" as="fc" hint-placeholder-count="4">
<button class="pill" onClick="{{fc.pick}}" aria-pressed="{{fc.pressed}}" style="flex: 1 1 88px; height: 40px; border-radius: 999px; border: 1.5px solid {{fc.border}}; background: {{fc.bg}}; color: {{fc.fg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 0 10px"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{fc.color}}"></span>{{fc.name}}</button>
</sc-for>
</div>
</div>

<div role="group" aria-labelledby="nt-imp" style="display: flex; flex-direction: column; gap: 6px">
<span id="nt-imp" class="flabel">Importance</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button class="pill" onClick="{{nf.setImp}}" aria-pressed="{{nf.impPressed}}" style="height: 42px; border-radius: 999px; border: 1.5px solid {{nf.impBorder}}; background: {{nf.impBg}}; color: {{nf.impFg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="15" height="15" viewBox="0 0 40 40" aria-hidden="true"><polygon points="20,5 36,34 4,34" fill="none" stroke="{{nf.impFg}}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polygon></svg>Important</button>
<button class="pill" onClick="{{nf.setRou}}" aria-pressed="{{nf.rouPressed}}" style="height: 42px; border-radius: 999px; border: 1.5px solid {{nf.rouBorder}}; background: {{nf.rouBg}}; color: {{nf.rouFg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="15" height="15" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="13" fill="none" stroke="{{nf.rouFg}}" stroke-width="2" vector-effect="non-scaling-stroke"></circle></svg>Routine</button>
</div>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px">
<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<span id="nt-date-l" class="flabel">Deadline <span style="font-weight: 500; color: var(--ink3)">(optional)</span></span>
<sc-if value="{{nf.hasDate}}" hint-placeholder-val="{{ false }}"><button onClick="{{nf.clearDate}}" style="border: 0; background: transparent; padding: 0; font-size: 12px; font-weight: 600; color: {{nf.pDark}}; cursor: pointer; text-decoration: underline">Clear</button></sc-if>
</div>
<button class="field pickbtn" onClick="{{nf.toggleDate}}" aria-haspopup="dialog" aria-expanded="{{nf.dateExpanded}}" aria-labelledby="nt-date-l nt-date-v" style="display: flex; align-items: center; gap: 8px; text-align: left; cursor: pointer; border-color: {{nf.dateBorder}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex: none"><rect x="2.5" y="3.5" width="11" height="10" rx="2" fill="none" stroke="{{nf.pColor}}" stroke-width="1.5"></rect><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3" stroke="{{nf.pColor}}" stroke-width="1.5" stroke-linecap="round"></path></svg><span id="nt-date-v" style="color: {{nf.dateColor}}">{{nf.dateText}}</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="flex: none; margin-left: auto"><path d="M3 4.5l3 3 3-3" fill="none" stroke="{{pal.ink3}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<sc-if value="{{nf.dateOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Pick a deadline" style="position: absolute; top: calc(100% + 10px); z-index: 8; box-sizing: border-box; background: {{pal.menu}}; border: 1px solid {{pal.border}}; border-radius: 22px; box-shadow: 0 18px 44px rgba(80,52,30,0.18), 0 2px 6px rgba(80,52,30,0.06); padding: 14px; display: flex; flex-direction: column; gap: 10px; left: 0; width: 304px">
<div aria-hidden="true" style="position: absolute; top: -8px; left: 26px; width: 14px; height: 14px; background: {{pal.menu}}; border-left: 1px solid {{pal.border}}; border-top: 1px solid {{pal.border}}; transform: rotate(45deg)"></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{nf.quick}}" as="q" hint-placeholder-count="5">
<button class="pill" onClick="{{q.pick}}" aria-pressed="{{q.pressed}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1.5px solid {{q.border}}; background: {{q.bg}}; color: {{q.fg}}; font-size: 12.5px; font-weight: 600; cursor: pointer">{{q.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<button class="iconbtn" onClick="{{nf.prevMonth}}" disabled="{{nf.atMin}}" aria-label="Previous month" style="width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{nf.prevOp}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M8.5 3L4.5 7l4 4" fill="none" stroke="{{pal.ink2}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<span style="font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; color: var(--ink)">{{nf.monthLabel}}</span>
<button class="iconbtn" onClick="{{nf.nextMonth}}" aria-label="Next month" style="width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.5 3l4 4-4 4" fill="none" stroke="{{pal.ink2}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink3); text-align: center">
<span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{nf.days}}" as="dd" hint-placeholder-count="35">
<sc-if value="{{dd.isDay}}" hint-placeholder-val="{{ true }}">
<button class="daybtn" onClick="{{dd.pick}}" disabled="{{dd.past}}" aria-pressed="{{dd.pressed}}" aria-label="{{dd.aria}}" style="position: relative; height: 34px; border-radius: 999px; border: 1.5px solid {{dd.border}}; background: {{dd.bg}}; color: {{dd.fg}}; font-size: 13px; font-weight: {{dd.weight}}; cursor: {{dd.cursor}}; padding: 0">{{dd.n}}<sc-if value="{{dd.dot}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: {{dd.dotColor}}"></span></sc-if></button>
</sc-if>
<sc-if value="{{dd.blank}}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
</sc-for>
</div>
</div>
</sc-if>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<span id="nt-time-l" class="flabel">Time</span>
<button class="field pickbtn" onClick="{{nf.toggleTime}}" aria-haspopup="dialog" aria-expanded="{{nf.timeExpanded}}" aria-labelledby="nt-time-l nt-time-v" style="display: flex; align-items: center; gap: 8px; text-align: left; cursor: pointer; border-color: {{nf.timeBorder}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex: none"><circle cx="8" cy="8" r="5.6" fill="none" stroke="{{nf.pColor}}" stroke-width="1.5"></circle><path d="M8 5v3.2l2.2 1.4" fill="none" stroke="{{nf.pColor}}" stroke-width="1.5" stroke-linecap="round"></path></svg><span id="nt-time-v">{{nf.timeLabel}}</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="flex: none; margin-left: auto"><path d="M3 4.5l3 3 3-3" fill="none" stroke="{{pal.ink3}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<sc-if value="{{nf.timeOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Pick a time" style="position: absolute; top: calc(100% + 10px); z-index: 8; box-sizing: border-box; background: {{pal.menu}}; border: 1px solid {{pal.border}}; border-radius: 22px; box-shadow: 0 18px 44px rgba(80,52,30,0.18), 0 2px 6px rgba(80,52,30,0.06); padding: 14px; display: flex; flex-direction: column; gap: 10px; right: 0; width: 248px">
<div aria-hidden="true" style="position: absolute; top: -8px; right: 26px; width: 14px; height: 14px; background: {{pal.menu}}; border-left: 1px solid {{pal.border}}; border-top: 1px solid {{pal.border}}; transform: rotate(45deg)"></div>
<div style="position: relative; display: flex; align-items: stretch; gap: 2px; height: 180px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%)">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 72px; height: 36px; border-radius: 12px; background: {{pal.soft}}; border: 1px solid {{pal.line}}; box-sizing: border-box"></div>
<div class="wheel" role="listbox" aria-label="Hour" onScroll="{{nf.hourScroll}}" ref="{{nf.hourRef}}" style="flex: 1; height: 180px; overflow-y: scroll; scroll-snap-type: y mandatory; box-sizing: border-box; padding: 72px 0; position: relative; z-index: 1">
<sc-for list="{{nf.hours}}" as="it" hint-placeholder-count="12">
<button class="wheelitem" role="option" aria-selected="{{it.sel}}" onClick="{{it.pick}}" style="display: block; width: 100%; height: 36px; border: 0; background: transparent; padding: 0; scroll-snap-align: center; font-family: 'Fredoka', sans-serif; font-size: 19px; font-weight: {{it.weight}}; color: {{it.color}}; cursor: pointer">{{it.label}}</button>
</sc-for>
</div>
<div class="wheel" role="listbox" aria-label="Minute" onScroll="{{nf.minuteScroll}}" ref="{{nf.minuteRef}}" style="flex: 1; height: 180px; overflow-y: scroll; scroll-snap-type: y mandatory; box-sizing: border-box; padding: 72px 0; position: relative; z-index: 1">
<sc-for list="{{nf.minutes}}" as="it" hint-placeholder-count="12">
<button class="wheelitem" role="option" aria-selected="{{it.sel}}" onClick="{{it.pick}}" style="display: block; width: 100%; height: 36px; border: 0; background: transparent; padding: 0; scroll-snap-align: center; font-family: 'Fredoka', sans-serif; font-size: 19px; font-weight: {{it.weight}}; color: {{it.color}}; cursor: pointer">{{it.label}}</button>
</sc-for>
</div>
<div class="wheel" role="listbox" aria-label="AM or PM" onScroll="{{nf.ampmScroll}}" ref="{{nf.ampmRef}}" style="flex: 1; height: 180px; overflow-y: scroll; scroll-snap-type: y mandatory; box-sizing: border-box; padding: 72px 0; position: relative; z-index: 1">
<sc-for list="{{nf.ampms}}" as="it" hint-placeholder-count="12">
<button class="wheelitem" role="option" aria-selected="{{it.sel}}" onClick="{{it.pick}}" style="display: block; width: 100%; height: 36px; border: 0; background: transparent; padding: 0; scroll-snap-align: center; font-family: 'Fredoka', sans-serif; font-size: 19px; font-weight: {{it.weight}}; color: {{it.color}}; cursor: pointer">{{it.label}}</button>
</sc-for>
</div>
</div>
<button onClick="{{nf.closePop}}" style="height: 36px; border: 0; border-radius: 10px; background: var(--inv); color: var(--invfg); font-size: 13px; font-weight: 600; cursor: pointer">Done</button>
</div>
</sc-if>
</div>
</div>

<div role="group" aria-labelledby="nt-rep" style="display: flex; flex-direction: column; gap: 6px">
<span id="nt-rep" class="flabel">Repeats</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{nf.repeats}}" as="rp" hint-placeholder-count="4">
<button class="pill" onClick="{{rp.pick}}" aria-pressed="{{rp.pressed}}" style="height: 38px; border-radius: 999px; border: 1.5px solid {{rp.border}}; background: {{rp.bg}}; color: {{rp.fg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 0 6px">{{rp.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nt-loc" class="flabel">Location <span style="font-weight: 500; color: var(--ink3)">(optional)</span></label>
<input id="nt-loc" class="field" type="text" placeholder="Where does it happen?" value="{{nf.loc}}" onChange="{{nf.setLoc}}">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nt-desc" class="flabel">Description</label>
<textarea id="nt-desc" class="field" rows="2" placeholder="Any details to remember" value="{{nf.desc}}" onChange="{{nf.setDesc}}" style="height: auto; padding: 10px 12px; resize: vertical; line-height: 1.45"></textarea>
</div>

<div style="display: flex; align-items: center; gap: 14px; background: {{pal.soft}}; border-radius: 18px; padding: 10px 14px 10px 10px">
<div style="width: 72px; height: 72px; flex: none; border-radius: 14px; background: {{pal.bg}}; display: flex; align-items: center; justify-content: center">
<span style="position: relative; width: {{nf.pSize}}px; height: {{nf.pSize}}px; display: block; transition: width .3s ease, height .3s ease">

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 8px; font-size: 13px; color: var(--ink)">
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 40 40" aria-hidden="true" style="flex: none"><path d="{{btnTriD}}" fill="{{pal.ink3}}"></path><circle cx="20" cy="20.5" r="2" fill="{{pal.menu}}"></circle><circle cx="16.5" cy="27" r="2" fill="{{pal.menu}}"></circle><circle cx="23.5" cy="27" r="2" fill="{{pal.menu}}"></circle></svg>Important</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 40 40" aria-hidden="true" style="flex: none"><circle cx="20" cy="20" r="16" fill="{{pal.ink3}}"></circle><circle cx="16" cy="16" r="2" fill="{{pal.menu}}"></circle><circle cx="24" cy="16" r="2" fill="{{pal.menu}}"></circle><circle cx="16" cy="24" r="2" fill="{{pal.menu}}"></circle><circle cx="24" cy="24" r="2" fill="{{pal.menu}}"></circle></svg>Routine</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 40 40" aria-hidden="true" style="flex: none"><circle cx="20" cy="20" r="11" fill="{{pal.ink3}}"></circle><circle cx="20" cy="20" r="17" fill="none" stroke="{{pal.ink}}" stroke-width="2.5" stroke-dasharray="4 4"></circle></svg>Open task</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 40 40" aria-hidden="true" style="flex: none"><circle cx="20" cy="20" r="16" fill="none" stroke="{{pal.warn}}" stroke-width="2.5"></circle><circle cx="20" cy="20" r="9" fill="{{pal.ink3}}"></circle></svg>Due by tomorrow</span>
</div>
<div style="display: flex; align-items: flex-end; gap: 5px">
<span style="width: 7px; height: 7px; border-radius: 50%; background: {{pal.ink3}}"></span>
<span style="width: 11px; height: 11px; border-radius: 50%; background: {{pal.ink3}}"></span>
<span style="width: 16px; height: 16px; border-radius: 50%; background: {{pal.ink3}}"></span>
<span style="font-size: 12.5px; color: var(--ink2); margin-left: 6px; line-height: 1.35">Buttons grow as the deadline nears</span>
</div>
<div style="border-top: 1.5px dashed {{pal.border}}; padding-top: 10px; display: flex; flex-direction: column; gap: 7px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3)">Stitches</span>
<sc-for list="{{stitchKey}}" as="sk" hint-placeholder-count="4">
<span style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink)">
<svg width="64" height="12" viewBox="0 0 64 12" aria-hidden="true" style="flex: none; overflow: visible"><path d="{{sk.d}}" fill="none" stroke="{{sk.color}}" stroke-width="2.4" stroke-dasharray="{{sk.dash}}" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-weight: 600">{{sk.name}}</span>
<span style="color: var(--ink3)">{{sk.stitch}}</span>
</span>
</sc-for>
<span style="display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink2)"><svg width="64" height="12" viewBox="0 0 64 12" aria-hidden="true" style="flex: none"><path d="M2 3H62" stroke="{{pal.ink3}}" stroke-width="1.4" stroke-linecap="round"></path><path d="M2 9H62" stroke="{{pal.ink3}}" stroke-width="4" stroke-linecap="round"></path></svg>Thicker thread joins important tasks</span>
<span style="display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink2)"><span style="width: 64px; display: flex; justify-content: center; flex: none"><span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{pal.ink3}}; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 6.5A5.5 5.5 0 0 0 3.2 5M3 2.2v3h3M3 9.5a5.5 5.5 0 0 0 9.8 1.5M13 13.8v-3h-3" fill="none" stroke="{{pal.ink3}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></span>Repeats: sewn back on when you finish</span>
</div>
<span style="font-size: 12.5px; line-height: 1.5; color: var(--ink2); border-top: 1.5px dashed {{pal.border}}; padding-top: 10px">Hover a button to tug the threads, click it to open the task. Drag the board to move and scroll to zoom.</span>
</div>
</sc-if>
</div>
</div>
<div class="felt stitch bar-zoom" role="group" aria-label="Zoom" style="position: absolute; right: 28px; bottom: 22px; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background-color: {{pal.menu}}; border: 1px solid {{pal.border}}; box-shadow: 0 8px 20px rgba(70,40,20,0.16); cursor: default">
<button class="zoombtn" onClick="{{zoomOut}}" aria-label="Zoom out" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: {{pal.soft}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7h8" stroke="{{pal.ink}}" stroke-width="1.8" stroke-linecap="round"></path></svg></button>
<span style="display: flex; align-items: center; gap: 0">
<button class="tapecase" onClick="{{zoomReset}}" aria-label="Reset zoom and position" title="Reset zoom" style="width: 34px; height: 34px; flex: none; box-sizing: border-box; border-radius: 50%; border: 2.5px solid #6E1F19; background: radial-gradient(circle at 35% 30%, #D2523F, #9B2A20 70%); box-shadow: 0 3px 8px rgba(60,20,10,0.3), inset 0 2px 0 rgba(255,255,255,0.25); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
<span aria-hidden="true" style="width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4F4F4, #9A9A9A); display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 50%; background: #5E5E5E"></span></span>
</button>
<input class="taperange" ref="{{rangeRef}}" type="range" min="50" max="250" step="5" value="{{zoomPct}}" onChange="{{zoomSlide}}" onInput="{{zoomSlide}}" aria-label="Zoom level" aria-valuetext="{{zoomLabel}}">
</span>
<button class="zoombtn" onClick="{{zoomIn}}" aria-label="Zoom in" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: {{pal.soft}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 3v8M3 7h8" stroke="{{pal.ink}}" stroke-width="1.8" stroke-linecap="round"></path></svg></button>
<span aria-hidden="true" ref="{{pctRef}}" style="min-width: 40px; text-align: right; font-size: 12.5px; font-weight: 700; color: var(--ink2)">{{zoomLabel}}</span>
</div>
</main></div>
</template>
<script src="js/runtime.js"></script>
<script src="js/app.js"></script>
<script src="js/main.js"></script>
</body>
</html>
